en:
  title: Data Integration System
  summary: Turning heterogeneous datasets from multiple sources into analysis-ready data.
  problem: Datasets from multiple sources used different schemas and variable definitions.
  approach: Built a system that standardizes schemas, harmonizes variable definitions, and merges heterogeneous datasets into analysis-ready data, with automated data quality checks.
ko:
  title: 데이터 통합 시스템
  summary: 여러 출처의 이질적인 데이터를 분석 가능한 데이터로 통합
  problem: 여러 출처의 데이터셋이 서로 다른 스키마와 변수 정의를 쓰고 있었습니다.
  approach: 스키마를 표준화하고 변수 정의를 일치시켜 이질적인 데이터셋을 분석 가능한 데이터로 병합하는 시스템을 만들고, 데이터 품질 자동 점검 기능을 넣었습니다.
